<!DOCTYPE html>
<html lang="en">

<head>
    <meta name=description
      content="A contact us page for White Water Rafting. Contains info about how to contact white water rafting.">
    <meta name=author content="William Zacher">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wrrlogo.png" alt="">
        <nav>
            <ul class="flex">
                <li><a href="index.html">Home</a>
                </li>
                <li><a href="about.html">About Us</a>
                </li>
                <li>
                    <a href="trips.html">Trips</a>
                </li>
                <li>
                    <a href="contact.html">Contact Us</a>
                </li>

            </ul>
        </nav>
    </header>
    <main>
        <div class="contact">
            <h1>White Water Rafting</h1>
            <article>
                <p>123 Main River Street</p>
                <p>River, State</p>
                <p>+1 999-999-9999</p>
                <p>info@whitewater.com</p>
            </article>
        </div>
        <div class="locateform">
            <div class="location">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d17968.58000527278!2d-122.66635328431123!3d-43.108815305116124!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1791004969193!5m2!1sen!2sus"
                  width="360" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div>
                <form>
                    <div class="form">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" required
                          placeholder="John Doe">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" required
                          placeholder="John@Doe.mail">
                        <label class="messagepurpose">Message Purpose</label>
                        <label>
                            <input type="radio" name="messagepurpose" value="generalinquiry"
                              id="option1">General
                            Inquiry
                        </label>
                        <label>
                            <input type="radio" name="messagepurpose" value="reservationquestion"
                              id="option2">Reservation Question
                        </label>
                        <label>
                            <input type="radio" name="messagepurpose" value="websitesuggestion"
                              id="option3">Website
                            Suggestion
                        </label>
                        <label for="message" class="message">Message</label>
                        <textarea name="message" id="message" class="message"
                          placeholder="Type Here"></textarea>

                        <label for="subscribe" class="subscribe"><input type="checkbox"
                              name="subscribe" id="subscribe">
                            Please Subscribe me to the monthly newsletter</label>
                        <button type="submit" class="submit">Get in Touch!</button>
                    </div>
                </form>
            </div>
        </div>
        <section class="serving">
            <h2 class="servingh2">We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img src="images/wrrlogo.jpg" alt="Employee photo one">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/wrrlogo.jpg" alt="Employee photo two">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/wrrlogo.jpg" alt="Employee photo three">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer">
            <p>©2026, 2026, White Water Rafting, William Zacher</p>
            <nav class="socialmedia">
                <a href="https://youtube.com"><img src="images/youtube-bw.svg"
                      alt="Link to Youtube"></a>
                <a href="https://facebook.com"><img src="images/facebook-bw.svg"
                      alt="Link to Facebook"></a>
                <a href="https://X.com"><img src="images/x-bw.svg" alt="Link to X"></a>
            </nav>
        </div>
    </footer>

</body>

</html>
